<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sukhumvit live traffic — Nana to Ekkamai in 3D</title>
<meta name="description" content="Live traffic on Bangkok's Sukhumvit corridor between Nana and Ekkamai BTS, on a 3D map you can rotate and tilt.">
<meta name="theme-color" content="#dfe7ee">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314213d'/%3E%3Cpath d='M5 22 L27 10' stroke='%233cb44b' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M5 12 L27 24' stroke='%23e8552d' stroke-width='5' stroke-linecap='round' opacity='.9'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<!-- Critical sizing inline so the map container has its size before MapLibre constructs. -->
<style>html,body{height:100%;margin:0}#map{position:fixed;inset:0}</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" role="application" aria-label="3D map of Sukhumvit Road between Nana and Ekkamai. Drag to rotate, drag up or down to tilt. Arrow keys also work."></div>

<aside class="panel" aria-label="Map information">
  <header>
    <h1>Sukhumvit live traffic</h1>
    <p class="sub">Nana BTS → Ekkamai BTS · Bangkok</p>
  </header>
  <ul class="legend" aria-label="Traffic speed compared with free flow">
    <li><i style="--c:#3cb44b"></i>Free flow</li>
    <li><i style="--c:#f5c531"></i>Slow</li>
    <li><i style="--c:#e8552d"></i>Heavy</li>
    <li><i style="--c:#8b1a1a"></i>Standstill</li>
  </ul>
  <p class="status" id="status" aria-live="polite">Loading traffic…</p>
  <div class="actions">
    <button id="reset" type="button">Reset view</button>
    <span class="hint">Drag to rotate · drag up/down to tilt</span>
  </div>
</aside>

<noscript><p class="noscript">This map needs JavaScript.</p></noscript>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script type="module" src="map.js"></script>
</body>
</html>
