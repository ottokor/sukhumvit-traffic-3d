name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          for f in corridor.js map.js scripts/*.mjs tests/*.mjs; do node --check "$f"; done
      - name: Unit tests
        run: npm test
      - name: Tile list and TomTom budget
        run: node scripts/refresh-traffic.mjs --dry-run
      - name: Frontend must never talk to TomTom or WAQI directly, or contain a key
        run: |
          if grep -nE 'api\.tomtom\.com|TOMTOM_API_KEY|api\.waqi\.info|WAQI_TOKEN|key=|token=' index.html map.js style.css corridor.js; then
            echo "::error::Frontend references TomTom, WAQI or a key/token. Traffic and air quality must come from /traffic/ only."
            exit 1
          fi
          echo "ok"
