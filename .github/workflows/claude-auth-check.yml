name: Claude auth check

# Manual smoke test: runs Claude with a one-word prompt and no tools, using whichever
# credential secret exists, with full output visible so an authentication error is readable.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: Reply with exactly the single word OK and nothing else.
          claude_args: |
            --max-turns 1
            --allowedTools ""
