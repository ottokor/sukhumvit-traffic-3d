name: PR review by Claude

# Reviews pull requests that a human opens. Agent branches (agent/*) are reviewed inside
# the agent-task pipeline instead, so they are skipped here.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    # Review only the owner's own pull requests; PRs from forks get no secrets anyway.
    if: ${{ github.actor == github.repository_owner && !github.event.pull_request.draft && !startsWith(github.head_ref, 'agent/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            You are the reviewer agent. Read .github/agents/reviewer.md and CLAUDE.md and follow them.
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Use `gh pr diff ${{ github.event.pull_request.number }}` for the change and `npm test` to run the tests.
            Post ONE review comment with `gh pr comment` using this shape:
              - first line: **Verdict: approve | request changes | needs your decision**
              - a 2–4 line summary for the human
              - findings as a list, each with severity, file and a concrete fix (omit the list if none)
            Use inline comments only for findings tied to a specific line.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(npm test:*),Bash(node:*)"
